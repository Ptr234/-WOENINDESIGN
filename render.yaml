# Render Blueprint for WOENINDESIGN Platform
# This file configures both database and web service deployment

databases:
  - name: woenindesign-db
    databaseName: woenindesign
    user: woenindesign_user
    plan: free # Can upgrade to starter ($7/month) or standard ($20/month)

services:
  - type: web
    name: woenindesign-app
    env: node
    plan: free # Can upgrade to starter ($7/month) or standard ($25/month)
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: woenindesign-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: woenindesign-app
          property: host
      - key: APP_URL
        fromService:
          type: web
          name: woenindesign-app
          property: host
      # Add your own values for these:
      - key: CLOUDINARY_CLOUD_NAME
        value: your-cloudinary-cloud-name
      - key: CLOUDINARY_API_KEY
        value: your-cloudinary-api-key
      - key: CLOUDINARY_API_SECRET
        value: your-cloudinary-api-secret
      - key: STRIPE_PUBLISHABLE_KEY
        value: pk_test_your_stripe_publishable_key
      - key: STRIPE_SECRET_KEY
        value: sk_test_your_stripe_secret_key
      - key: STRIPE_WEBHOOK_SECRET
        value: whsec_your_stripe_webhook_secret
      - key: EMAIL_SERVER_HOST
        value: smtp.gmail.com
      - key: EMAIL_SERVER_PORT
        value: 587
      - key: EMAIL_SERVER_USER
        value: your-email@gmail.com
      - key: EMAIL_SERVER_PASSWORD
        value: your-gmail-app-password
      - key: ADMIN_EMAIL
        value: admin@woenindesign.com